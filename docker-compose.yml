# Silo in one container. The omnibus image runs Silo with a bundled
# PostgreSQL and Redis, and starts the bundled Meilisearch when
# ENABLE_MEILISEARCH is set. Settings come from .env; see .env.example.
# docs/architecture/omnibus-image.md describes the image.
#
# For hardware transcoding, layer docker-compose.vaapi.yml or
# docker-compose.nvidia.yml on this file (COMPOSE_FILE in .env.example). For
# proxy or transcode nodes on other hosts, layer docker-compose.node-access.yml
# here and run docker-compose.node.yml on each node's host.

# The services that keep the names of the multi-container stack's PostgreSQL,
# Redis, and Meilisearch; see the note under services.
x-bridge: &bridge
  image: ${SILO_OMNIBUS_IMAGE:-ghcr.io/silo-server/silo-server:aio}
  entrypoint: ["true"]
  restart: "no"
  network_mode: none
  healthcheck:
    disable: true
  # The image declares /config a volume; this keeps Docker from creating an
  # empty one for each of these containers.
  tmpfs: /config

services:
  silo:
    image: ${SILO_OMNIBUS_IMAGE:-ghcr.io/silo-server/silo-server:aio}
    restart: unless-stopped
    # On stop Silo fails readiness, keeps serving for SILO_SHUTDOWN_DELAY
    # (default 5s), then finishes in-flight requests, and PostgreSQL shuts
    # down after it. Docker kills a container 10s after asking it to stop,
    # which would cut that short.
    stop_grace_period: 2m
    environment:
      # Keep the container listeners fixed. PORT, JF_PORT and ABS_PORT in .env
      # are host-side published-port overrides.
      PORT: "8080"
      JF_PORT: "8096"
      ABS_PORT: "13378"
      # The account that runs Silo, owns /config/silo, and reads the media.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      # Master key for at-rest credential encryption. Required — the server
      # refuses to start without it. Generate with: openssl rand -base64 48
      # Back it up SEPARATELY from your database dumps; losing it makes encrypted
      # secrets unrecoverable. See docs/architecture/secret-encryption.md.
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env — generate one with openssl rand -base64 48}
      # Watch Party rooms need Redis, and the multi-container stack always
      # ran it, so it is on here unless .env sets ENABLE_REDIS=false or a
      # REDIS_URL of its own. The image itself leaves it off, for nodes.
      ENABLE_REDIS: ${ENABLE_REDIS:-true}
      # Off by default. Set to "true" to start the bundled Meilisearch.
      ENABLE_MEILISEARCH: ${ENABLE_MEILISEARCH:-false}
      # Until the postgres service below has run once, Silo creates no empty
      # database, so `up --no-deps silo` cannot start a new install in front
      # of an earlier one the migration has yet to move.
      REQUIRE_COMPOSE_MIGRATION: "true"
    ports:
      - "${PORT:-8090}:8080"
      - "${JF_PORT:-8096}:8096"
      - "${ABS_PORT:-13378}:13378"
    volumes:
      # Silo's state, the PostgreSQL cluster, and the Redis and Meilisearch data.
      - ${SILO_DATA_ROOT:-/opt/silo}/config:/config
      - ${MEDIA_ROOT:?Set MEDIA_ROOT in .env to the host media path}:${MEDIA_CONTAINER_ROOT:-/mnt/media}:ro
      # Transcode segments, kept out of /config so a backup of it stays small.
      - ${SILO_DATA_ROOT:-/opt/silo}/transcode:/tmp/silo-transcode
      # Prepared downloads. With "Prepared file directory" (download.artifact_dir)
      # blank, Silo keeps them beside the transcode directory, not inside it, so
      # they need their own mount to survive image updates. This path assumes the
      # default playback.transcode_dir; with another one, mount the
      # silo-download-artifacts directory beside it instead. No storage
      # budget applies until one is set ("Default storage budget per location",
      # download.artifact_max_bytes, in Settings > Downloads).
      - ${SILO_DATA_ROOT:-/opt/silo}/download-artifacts:/tmp/silo-download-artifacts
      - ${SILO_DATA_ROOT:-/opt/silo}/catalog-seeds:/catalog-seeds:ro
      # Only load-bearing when the Docker host is itself an LXC container, where
      # these three files describe the physical machine and the LXC's own cap
      # sits on a cgroup this container cannot see. lxcfs virtualizes them to the
      # LXC's limits, so passing that view in is what makes CPU, load, and memory
      # report this container's share instead of the whole machine's. Harmless
      # everywhere else: on bare metal or a VM they are the same files Silo would
      # read anyway. Each is used independently, so dropping one only reverts
      # that reading. See docs/architecture/observability.md#node-resource-sampling.
      - /proc/meminfo:/host/proc/meminfo:ro
      - /proc/stat:/host/proc/stat:ro
      - /proc/loadavg:/host/proc/loadavg:ro
    depends_on:
      postgres:
        condition: service_completed_successfully
      redis:
        condition: service_completed_successfully
      meilisearch:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false

  # Earlier versions of this file ran PostgreSQL, Redis, and Meilisearch as
  # services of their own. These three keep those names, so `docker compose up`
  # replaces the old containers, which stops them, before Silo starts. Each
  # exits at once. The postgres service first copies an earlier install into
  # the layout above and leaves the old directories as they were; see "Moving
  # from the multi-container stack" in docs/architecture/omnibus-image.md.
  postgres:
    <<: *bridge
    entrypoint: ["/etc/silo-omnibus/migrate-compose-stack"]
    environment:
      SILO_DATA_ROOT: ${SILO_DATA_ROOT:-/opt/silo}
      PUID: ${PUID:-1000}
      # The names the earlier stack created its database and superuser with.
      POSTGRES_USER: ${POSTGRES_USER:-silo}
      POSTGRES_DB: ${POSTGRES_DB:-silo}
      # Settings from .env that meant something else to the earlier stack.
      # The migration refuses ones that would now point Silo at a removed
      # service, a different image, or an empty database.
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-}
      SILO_SEARCH_PROVIDER: ${SILO_SEARCH_PROVIDER:-}
      SILO_MEILISEARCH_URL: ${SILO_MEILISEARCH_URL:-}
      SILO_IMAGE: ${SILO_IMAGE:-}
      SILO_OMNIBUS_IMAGE: ${SILO_OMNIBUS_IMAGE:-}
      POSTGRES_PASSWORD_SET: ${POSTGRES_PASSWORD:+set}
      ENABLE_MEILISEARCH: ${ENABLE_MEILISEARCH:-false}
      ENABLE_REDIS: ${ENABLE_REDIS:-true}
    volumes:
      - ${SILO_DATA_ROOT:-/opt/silo}:/silo-data
  redis: *bridge
  meilisearch: *bridge

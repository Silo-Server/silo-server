name: Trusted Linux image build
on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      build_number:
        required: true
        type: string
      built_at:
        required: true
        type: string
      image_version:
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GOPROXY: https://proxy.golang.org,direct
  GOPRIVATE: github.com/Silo-Server/*
  GONOSUMDB: github.com/Silo-Server/*

jobs:
  build:
    # A PR cannot turn this publisher into a privileged PR-code build.
    if: >-
      github.repository == 'Silo-Server/silo-server' &&
      contains(fromJSON('["linux/amd64","linux/arm64"]'), inputs.platform) &&
      ((github.event_name == 'workflow_dispatch' &&
        contains(fromJSON('["refs/heads/main","refs/heads/apiv2"]'), github.ref)) ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        contains(fromJSON('["main","apiv2"]'), github.event.workflow_run.head_branch)))
    runs-on: ${{ inputs.platform == 'linux/amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Prepare platform slug and lowercase image name
        run: |
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
          echo "IMAGE_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ inputs.platform }}

      - name: Download validated frontend bundle
        uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_run'
        with:
          name: frontend-dist-${{ github.event.workflow_run.head_sha || github.sha }}
          path: web/dist
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download shared frontend bundle for manual builds
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.run_id }}-${{ github.sha }}
          path: web/dist
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Reject committed local SDK replaces
        run: |
          if grep -Eq '^replace github.com/Silo-Server/silo-plugin-sdk => /' go.mod; then
            echo "go.mod contains a machine-local silo-plugin-sdk replace."
            exit 1
          fi

      - name: Validate SDK resolves from the module graph
        env:
          GOWORK: off
        run: |
          sdk_module_json="$(mktemp)"
          go list -m -json github.com/Silo-Server/silo-plugin-sdk > "$sdk_module_json"
          if grep -q '"Main": true' "$sdk_module_json"; then
            echo "silo-plugin-sdk resolved from the local workspace instead of go.mod."
            cat "$sdk_module_json"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.created=${{ inputs.built_at }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
            org.opencontainers.image.version=${{ inputs.image_version }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-contexts: |
            frontend_dist=./web/dist
          build-args: |
            BUILD_REVISION=${{ github.event.workflow_run.head_sha || github.sha }}
            BUILD_DIRTY=false
            BUILD_NUMBER=${{ inputs.build_number }}
            BUILD_DATE=${{ inputs.built_at }}
          cache-from: ${{ runner.environment == 'self-hosted' && format('type=local,src=/cache/buildkit/{0}', env.PLATFORM_PAIR) || format('type=gha,scope=docker-{0}', env.PLATFORM_PAIR) }}
          cache-to: ${{ runner.environment == 'self-hosted' && format('type=local,dest=/cache/buildkit/{0}-new,mode=max', env.PLATFORM_PAIR) || format('type=gha,scope=docker-{0},mode=max', env.PLATFORM_PAIR) }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_LC }},push-by-digest=true,name-canonical=true,push=true

      - name: Keep the local Docker layer cache
        if: runner.environment == 'self-hosted' && steps.build.outcome == 'success'
        run: |
          rm -rf "/cache/buildkit/${PLATFORM_PAIR}"
          mv "/cache/buildkit/${PLATFORM_PAIR}-new" "/cache/buildkit/${PLATFORM_PAIR}"

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

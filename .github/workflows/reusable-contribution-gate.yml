name: Contribution gate (reusable)

# Enforces the Silo pull request policy. silo-server, silo-apple, silo-android,
# and silo-roku each call this from their own contribution-gate.yml on
# pull_request_target (opened, reopened, converted_to_draft, edited), so it acts
# on the calling repository. For a pull request from someone without triage or
# write access:
#
# 1. Drafts are closed, both when they open as drafts and when they are
#    converted to drafts. Callers run on `converted_to_draft` for that.
# 2. A fourth open pull request from the same person in the repository is
#    closed.
# 3. A pull request must fix a bug: its title is a `fix` or `perf` Conventional
#    Commit. Anything else must link an issue in the calling repository that a
#    maintainer labeled `accepted`, which is how a maintainer asks for it. An edit
#    to the title or description checks this rule again.
#
# A merged pull request earns no exemption. Maintainers (triage access or
# higher) and bots are exempt. A maintainer lets a closed pull request through
# by reopening it, which adds the `invited` label; a pull request with that
# label is never closed by this workflow. The separate evidence deadline
# workflow still applies to it.
#
# pull_request_target runs with a write token on fork pull requests. That is safe
# here only because this job never checks out or runs code from the pull
# request. Keep it that way, and never interpolate pull request fields into the
# script with ${{ }}; read them from the event payload.

on:
  workflow_call:
    inputs:
      contributing_url:
        description: Page that explains the pull request policy. Defaults to the calling repository's CONTRIBUTING.md.
        required: false
        type: string
        default: ""

jobs:
  gate:
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: write
    steps:
      - name: Apply contribution policy
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CONTRIBUTING_URL: ${{ inputs.contributing_url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const sender = context.payload.sender.login;
            const INVITED = "invited";
            const ACCEPTED = "accepted";
            const OPEN_LIMIT = 3;
            const contributing = process.env.CONTRIBUTING_URL || `https://github.com/${owner}/${repo}/blob/HEAD/CONTRIBUTING.md`;
            const ideas = `https://github.com/${owner}/${repo}/discussions/categories/ideas`;
            const notJudgment = "That isn't a judgment of the work.";

            // Triage counts, so org members can be exempted without write access.
            async function isMaintainer(username) {
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username });
                return ["admin", "maintain", "write", "triage"].includes(data.role_name);
              } catch (error) {
                if (error.status === 404) return false;
                throw error;
              }
            }

            async function close(...paragraphs) {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: paragraphs.join("\n\n") });
              await github.rest.pulls.update({ owner, repo, pull_number: pr.number, state: "closed" });
            }

            if (pr.labels.some((label) => label.name === INVITED)) {
              core.info(`#${pr.number} has the ${INVITED} label; skipping.`);
              return;
            }

            if (context.payload.action === "reopened") {
              if (sender !== author && (await isMaintainer(sender))) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [INVITED] });
                core.info(`${sender} reopened #${pr.number}; marked it ${INVITED}.`);
                return;
              }
            }

            // Decide by repository role, not author_association: MEMBER and
            // COLLABORATOR include read-only access, and CONTRIBUTOR only means a
            // commit on the default branch.
            if (await isMaintainer(author)) {
              core.info(`${author} is a maintainer; skipping.`);
              return;
            }

            // An edit can only break rule 3, the title or description rule.
            const edited = context.payload.action === "edited";
            const changes = context.payload.changes || {};
            if (edited && !changes.title && !changes.body) {
              core.info(`#${pr.number} changed neither title nor description; nothing to check.`);
              return;
            }
            if (edited && sender !== author && (await isMaintainer(sender))) {
              core.info(`${sender} edited #${pr.number}; a maintainer's edit is not checked.`);
              return;
            }

            if (pr.draft && !edited) {
              core.info(`#${pr.number} is a draft from ${author}; closing.`);
              await close(
                `Thanks for the pull request. Silo doesn't take draft pull requests from contributors, so this one is closed. ${notJudgment}`,
                `When the change is ready for review, open a new pull request with its evidence. [The contributing guide](${contributing}) explains why.`,
              );
              return;
            }

            // An edit cannot add a pull request, so only opens, reopens, and conversions
            // are counted. When several open at once, each run sees the others, so a new
            // pull request counts only older ones; a reopened or converted one counts
            // every other.
            if (!edited) {
              const others = (await github.paginate(github.rest.pulls.list, { owner, repo, state: "open", per_page: 100 }))
                .filter((open) => open.user.login === author && open.number !== pr.number)
                .filter((open) => context.payload.action !== "opened" || open.number < pr.number);
              if (others.length >= OPEN_LIMIT) {
                core.info(`${author} already has ${others.length} open pull requests; closing #${pr.number}.`);
                await close(
                  `Thanks for the pull request. Contributors can have ${OPEN_LIMIT} open pull requests in a Silo repository at a time, and you already have ${others.length} here, so this one is closed without review. ${notJudgment}`,
                  `Once one of them merges or closes, open this again. [The contributing guide](${contributing}) explains why.`,
                );
                return;
              }
            }

            if (/^(fix|perf)(\([^)]*\))?!?:/i.test(pr.title.trim())) {
              core.info(`#${pr.number} is a bug fix; nothing more to check.`);
              return;
            }

            // Issues in this repository that the description references as #N,
            // owner/repo#N, or a full issue URL, outside HTML comments (the pull
            // request template's comments carry example issue numbers).
            const repoRef = `${owner}/${repo}`.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const refPattern = new RegExp(
              `(?:https://github\\.com/${repoRef}/issues/|(?<![\\w/])${repoRef}#|(?<![\\w/#])#)(\\d+)\\b`,
              "gi",
            );
            const body = (pr.body || "").replace(/<!--[\s\S]*?-->/g, "");
            const referenced = new Set([...body.matchAll(refPattern)].map((match) => Number(match[1])));

            const acceptedIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, labels: ACCEPTED, state: "all", per_page: 100,
            });
            const linked = acceptedIssues.find((issue) => !issue.pull_request && referenced.has(issue.number));
            if (linked) {
              core.info(`#${pr.number} links accepted issue #${linked.number}.`);
              return;
            }

            core.info(`#${pr.number} is not a bug fix and links no accepted issue; closing.`);
            await close(
              `Thanks for the pull request. Silo takes pull requests from contributors for bug fixes, with a \`fix\` or \`perf\` title. Anything else needs a maintainer to ask for it by labeling an issue in this repository \`${ACCEPTED}\`, and this pull request doesn't link one, so it is closed without review. ${notJudgment}`,
              `Feature ideas go in [Discussions → Ideas](${ideas}). If this fixes a bug, open a new pull request with a \`fix:\` title. If a maintainer labels an issue \`${ACCEPTED}\` for this change, link it (for example \`Closes #123\`) in a new pull request. [The contributing guide](${contributing}) has the details.`,
            );

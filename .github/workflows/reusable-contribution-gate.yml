name: Contribution gate (reusable)

# Enforces the Silo pull request policy. silo-server, silo-apple, silo-android,
# and silo-roku each call this from their own contribution-gate.yml on
# pull_request_target, so it acts on the calling repository:
#
# 1. Pull requests are open to people who have had one merged in a Silo-Server
#    repository. Other pull requests are closed without review.
# 2. A feature pull request (title starts with `feat`) from someone without
#    triage or write access must link an issue in the calling repository that
#    a maintainer labeled `accepted`.
#
# Maintainers (triage access or higher) and bots are exempt. A maintainer lets
# a closed pull request through by reopening it, which adds the `invited` label;
# a pull request with that label is never closed by this workflow.
#
# pull_request_target runs with a write token on fork pull requests. That is safe
# here only because this job never checks out or runs code from the pull
# request. Keep it that way, and never interpolate pull request fields into the
# script with ${{ }}; read them from the event payload.

on:
  workflow_call:
    inputs:
      contributing_url:
        description: Page that explains the pull request policy. Defaults to the calling repository's CONTRIBUTING.md.
        required: false
        type: string
        default: ""

jobs:
  gate:
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: write
    steps:
      - name: Apply contribution policy
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CONTRIBUTING_URL: ${{ inputs.contributing_url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const INVITED = "invited";
            const ACCEPTED = "accepted";
            const contributing = process.env.CONTRIBUTING_URL || `https://github.com/${owner}/${repo}/blob/HEAD/CONTRIBUTING.md`;
            const ideas = `https://github.com/${owner}/${repo}/discussions/categories/ideas`;

            // Triage counts: org members can be granted it without write access, and
            // private org membership does not show in author_association.
            async function isMaintainer(username) {
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username });
                return ["admin", "maintain", "write", "triage"].includes(data.role_name);
              } catch (error) {
                if (error.status === 404) return false;
                throw error;
              }
            }

            async function close(reason) {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: reason });
              await github.rest.pulls.update({ owner, repo, pull_number: pr.number, state: "closed" });
            }

            if (pr.labels.some((label) => label.name === INVITED)) {
              core.info(`#${pr.number} has the ${INVITED} label; skipping.`);
              return;
            }

            if (context.payload.action === "reopened") {
              const sender = context.payload.sender.login;
              if (sender !== author && (await isMaintainer(sender))) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [INVITED] });
                core.info(`${sender} reopened #${pr.number}; marked it ${INVITED}.`);
                return;
              }
            }

            if (["OWNER", "MEMBER", "COLLABORATOR"].includes(pr.author_association) || (await isMaintainer(author))) {
              core.info(`${author} is a maintainer; skipping.`);
              return;
            }

            // CONTRIBUTOR means the author already has a commit on this repository's
            // default branch. Anyone else needs a merged pull request elsewhere in the org.
            if (pr.author_association !== "CONTRIBUTOR") {
              const { data } = await github.rest.search.issuesAndPullRequests({
                q: `org:${owner} is:pr is:merged author:${author}`,
                per_page: 1,
              });
              if (data.incomplete_results) {
                throw new Error(`Search for ${author}'s merged pull requests timed out; leaving #${pr.number} open.`);
              }
              if (data.total_count === 0) {
                core.info(`${author} has no merged pull request in ${owner}; closing #${pr.number}.`);
                await close([
                  "Thanks for the pull request. Silo takes pull requests from people who have had one merged in a Silo repository, or whom a maintainer has asked for one, so this one is closed without review. That isn't a judgment of the work.",
                  "",
                  `If the problem still matters, open an issue for it and link this pull request; a maintainer may reopen it or use the code as a reference. Feature ideas go in [Discussions → Ideas](${ideas}). [The contributing guide](${contributing}) explains why.`,
                ].join("\n"));
                return;
              }
            }

            if (!/^feat(\([^)]*\))?!?:/i.test(pr.title)) {
              core.info(`#${pr.number} is not a feature pull request; nothing to check.`);
              return;
            }

            // Issues in this repository that the description references as #N,
            // owner/repo#N, or a full issue URL, outside HTML comments (the pull
            // request template's comments carry example issue numbers).
            const repoRef = `${owner}/${repo}`.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const refPattern = new RegExp(
              `(?:https://github\\.com/${repoRef}/issues/|(?<![\\w/])${repoRef}#|(?<![\\w/#])#)(\\d+)\\b`,
              "gi",
            );
            const body = (pr.body || "").replace(/<!--[\s\S]*?-->/g, "");
            const referenced = new Set([...body.matchAll(refPattern)].map((match) => Number(match[1])));

            const acceptedIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, labels: ACCEPTED, state: "all", per_page: 100,
            });
            const linked = acceptedIssues.find((issue) => !issue.pull_request && referenced.has(issue.number));
            if (linked) {
              core.info(`#${pr.number} links accepted issue #${linked.number}.`);
              return;
            }

            core.info(`#${pr.number} is a feature pull request without an accepted issue; closing.`);
            await close([
              `Thanks for the pull request. A feature pull request needs a linked issue that a maintainer has labeled \`${ACCEPTED}\`, and this one doesn't link one, so it is closed without review.`,
              "",
              `Propose the feature in [Discussions → Ideas](${ideas}), or ask on an existing issue. Once an issue carries the \`${ACCEPTED}\` label, link it in the description (for example \`Closes #123\`) of a new pull request, or ask a maintainer to reopen this one. [The contributing guide](${contributing}) has the details.`,
            ].join("\n"));

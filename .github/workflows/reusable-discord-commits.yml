name: Discord Commit Feed (reusable)

# Posts a summary of the pushed commits to the caller's post in the Discord
# commit-feed forum channel. silo-server, silo-apple, and silo-android each call
# this from their own discord-commits.yml, so every repository gets its own post.

on:
  workflow_call:
    inputs:
      thread_id:
        description: ID of the forum post (thread) that receives this repository's commits.
        required: true
        type: string
    secrets:
      webhook_url:
        description: Webhook URL of the commit-feed forum channel.
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Send commit summary to Discord
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.webhook_url }}
          DISCORD_THREAD_ID: ${{ inputs.thread_id }}
        with:
          script: |
            const webhookUrl = process.env.DISCORD_WEBHOOK_URL;
            const threadId = process.env.DISCORD_THREAD_ID;
            if (!webhookUrl) {
              core.setFailed("DISCORD_COMMITS_WEBHOOK_URL is not configured.");
              return;
            }
            if (!threadId) {
              core.setFailed("DISCORD_COMMITS_THREAD_ID is not configured.");
              return;
            }

            const commits = context.payload.commits || [];
            const displayedCommits = commits.slice(0, 10);
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const branch = context.ref.replace("refs/heads/", "");

            const lines = displayedCommits.map((commit) => {
              const sha = commit.id.slice(0, 7);
              const title = commit.message.split("\n")[0].slice(0, 120);
              const author = commit.author?.name || "unknown";
              return `- \`${sha}\` ${title} - **${author}**`;
            });

            if (commits.length > displayedCommits.length) {
              lines.push(`...and ${commits.length - displayedCommits.length} more commit(s)`);
            }

            let content =
              `**${repo}**\n` +
              `${commits.length} commit(s) pushed to \`${branch}\` by **${context.actor}**\n\n` +
              `${lines.join("\n")}`;

            if (context.payload.compare) {
              content += `\n\n<${context.payload.compare}>`;
            }

            if (content.length > 1900) {
              content = `${content.slice(0, 1897)}...`;
            }

            // A forum-channel webhook must name the post to write into.
            const url = new URL(webhookUrl);
            url.searchParams.set("thread_id", threadId);

            const response = await fetch(url, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ content }),
            });

            if (!response.ok) {
              const body = await response.text();
              core.setFailed(`Discord webhook failed with ${response.status}: ${body}`);
            }

name: ebookconvert (wasm smoke + provenance)

# Guards the committed internal/ebookconvert/mobitool.wasm against silent rot:
# runs the real fixture conversions (the smoke test) and verifies the artifact
# matches its recorded sha256. Pure-Go + wazero, no libvips/cgo needed.
#
# Trigger mirrors docker.yml's posture (push + manual) so it runs on the same
# trusted self-hosted runner the rest of the Go build uses; the package needs
# the private silo-plugin-sdk in the module graph, so a public runner would need
# GOPRIVATE auth configured. Maintainers comfortable running self-hosted on PRs
# can add a `pull_request` trigger here for pre-merge coverage.

on:
  push:
    paths:
      - "internal/ebookconvert/**"
      - "tools/mobitool-wasm/**"
      - ".github/workflows/ebookconvert.yml"
  workflow_dispatch:

concurrency:
  group: ebookconvert-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOPRIVATE: github.com/Silo-Server/*
  GONOSUMDB: github.com/Silo-Server/*

jobs:
  test:
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Smoke-convert fixtures + verify wasm provenance
        env:
          GOWORK: off
        run: go test ./internal/ebookconvert/... -count=1

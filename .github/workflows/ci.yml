name: CI

on:
  pull_request:
  push:
    branches:
      - main
      # Integration branch for the API v2 program (#135). Stacked PRs merge
      # here first; the merge commits need the same gate as main.
      - apiv2
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOPRIVATE: github.com/Silo-Server/*
  GONOSUMDB: github.com/Silo-Server/*
  # Pinned so a lint gate cannot change its mind between two runs of the same
  # commit. Built from source below rather than downloaded: a released binary
  # refuses to run against a Go version newer than the one it was built with,
  # and go.mod tracks Go closely enough that this repo is regularly ahead.
  GOLANGCI_LINT_VERSION: v2.12.2

# The default token is read-write. Only the cache prune job writes, and only
# to the Actions cache; every other job keeps a read-only token, which is one
# fewer thing a compromised dependency can reach.
permissions:
  contents: read

jobs:
  ci:
    permissions:
      actions: write
      contents: read
    uses: Silo-Server/silo-server/.github/workflows/trusted-linux-ci.yml@main
    with:
      self_hosted: false

  # Needs only the Compose CLI, and runs from this file so a pull request
  # checks its own Compose files and bootstrap script.
  compose:
    name: Compose credentials
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify Compose credential handling
        run: python3 scripts/check-compose-credentials.py

name: Release
run-name: Prepare v${{ inputs.version }}

# Drafts a GitHub release for the main commit this runs on. Publishing the
# draft runs release-published.yml, which tags the image CI already built for
# this commit with the version. See docs/release-versioning.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, for example 0.24.0 or 1.0.0-rc.1. A version with -rc.N is a prerelease."
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Prepare draft GitHub release
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the draft release
      actions: read # find the commit's CI run
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main."
          exit 1

      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every tag
          persist-credentials: false

      - name: Check the version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: python3 scripts/release/release_version.py check "$VERSION" | tee -a "$GITHUB_OUTPUT"

      # A push run of CI records the commit it tested, so it can be looked up
      # by this commit. A manual Docker Image run skips CI, so the image
      # existing doesn't prove CI passed.
      - name: Require CI to have passed on this commit
        run: |
          conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event push \
            --commit "$GITHUB_SHA" --limit 1 --json conclusion --jq '.[0].conclusion // ""')"
          if [[ "$conclusion" != "success" ]]; then
            echo "::error::CI has not passed on ${GITHUB_SHA::9} (${conclusion:-still running or missing})."
            exit 1
          fi

      # The release reuses this commit's image, so it must exist. Ask the
      # registry, not the Docker Image workflow's run list: a workflow_run
      # build records main's head at trigger time, which can be a later commit
      # than the one it publishes.
      - name: Require the commit's image to be published
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          if ! docker buildx imagetools inspect "$image" > /dev/null; then
            echo "::error::$image isn't published yet. Release once the Docker Image workflow has published ${GITHUB_SHA::9}."
            exit 1
          fi

      - name: Stage the v2 OpenAPI artifact and its digest
        run: |
          # The release carries the exact committed bytes of the v2 contract,
          # never a regenerated copy, so downstream copies can be verified
          # against the digest attached beside it.
          asset_dir="$(mktemp -d)"
          cp contracts/api/v2/openapi.json "$asset_dir/openapi.json"
          (
            cd "$asset_dir"
            sha256sum openapi.json > openapi.json.sha256
            sha256sum -c openapi.json.sha256
          )
          echo "ASSET_DIR=$asset_dir" >> "$GITHUB_ENV"

      # The first release has no earlier tag, so generated notes would list
      # every pull request ever merged; its notes are written by hand.
      - name: Create the draft release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "Silo $VERSION")
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          if [[ -n "$PREVIOUS_TAG" ]]; then
            args+=(--generate-notes --notes-start-tag "$PREVIOUS_TAG")
          else
            args+=(--notes "First release: replace this line with release notes.")
          fi
          gh release create "$TAG" "${args[@]}" \
            "$ASSET_DIR/openapi.json" "$ASSET_DIR/openapi.json.sha256"
          {
            echo "Drafted $TAG on ${GITHUB_SHA::9}."
            echo
            echo "Edit the notes, including upgrade and compatibility impact, then publish the draft."
            echo "Publishing tags this commit's Docker image as $VERSION."
          } >> "$GITHUB_STEP_SUMMARY"

name: Docker Image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, apiv2]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Published build numbers belong to this workflow. Keep it as the sole owner
  # of the sequence; raise the offset if the workflow counter ever loses
  # continuity so a new build remains greater than every existing build tag.
  BUILD_NUMBER_OFFSET: 0
  GOPROXY: https://proxy.golang.org,direct
  GOPRIVATE: github.com/Silo-Server/*
  GONOSUMDB: github.com/Silo-Server/*

jobs:
  prepare:
    name: Prepare build identity
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      build_number: ${{ steps.identity.outputs.build_number }}
      built_at: ${{ steps.identity.outputs.built_at }}
      image_version: ${{ steps.identity.outputs.image_version }}
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       contains(fromJSON('["refs/heads/main","refs/heads/apiv2"]'), github.ref)) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       contains(fromJSON('["main","apiv2"]'), github.event.workflow_run.head_branch))
    steps:
      - name: Resolve build identity
        id: identity
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TARGET_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          if [[ -z "$DEFAULT_BRANCH" ]]; then
            echo "::error::Repository default branch is unavailable."
            exit 1
          fi

          build_number=""
          image_version="${GITHUB_SHA::7}"
          if [[ "$TARGET_BRANCH" == "$DEFAULT_BRANCH" ]]; then
            build_number=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))
            if (( build_number <= 0 )); then
              echo "::error::Build number must be positive."
              exit 1
            fi
            image_version="build-${build_number}"
          fi

          {
            echo "build_number=${build_number}"
            echo "built_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "image_version=${image_version}"
          } >> "$GITHUB_OUTPUT"

  frontend:
    name: Build frontend for manual images
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Silo-Server/silo-server'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build frontend
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Upload frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.run_id }}-${{ github.sha }}
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [prepare, frontend]
    # The manual-only frontend job is skipped for completed push CI runs.
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      ((github.event_name == 'workflow_run' && needs.frontend.result == 'skipped') ||
       (github.event_name == 'workflow_dispatch' && needs.frontend.result == 'success'))
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    permissions:
      contents: read
      actions: read
      packages: write
    uses: Silo-Server/silo-server/.github/workflows/trusted-linux-build.yml@main
    with:
      platform: ${{ matrix.platform }}
      build_number: ${{ needs.prepare.outputs.build_number }}
      built_at: ${{ needs.prepare.outputs.built_at }}
      image_version: ${{ needs.prepare.outputs.image_version }}

  merge:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: "!cancelled() && needs.prepare.result == 'success' && needs.build.result == 'success'"
    permissions:
      packages: write

    steps:
      - name: Prepare lowercase image name
        run: echo "IMAGE_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_LC }}
          tags: |
            type=raw,value=latest,enable=${{ github.event.workflow_run.head_branch == github.event.repository.default_branch || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) }}
            type=raw,value=build-${{ needs.prepare.outputs.build_number }},enable=${{ github.event.workflow_run.head_branch == github.event.repository.default_branch || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) }}
            type=raw,value=apiv2,enable=${{ github.event.workflow_run.head_branch == 'apiv2' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'apiv2') }}
            type=raw,value=${{ (github.event.workflow_run.head_sha || github.sha) }}

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY}/${IMAGE_LC}@sha256:%s " *)

      - name: Inspect manifest list
        env:
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE_LC}:${{ github.event.workflow_run.head_sha || github.sha }}"
          if [[ "${GITHUB_REF_NAME}" == "${DEFAULT_BRANCH}" || "${{ github.event.workflow_run.head_branch }}" == "${DEFAULT_BRANCH}" ]]; then
            docker buildx imagetools inspect "${REGISTRY}/${IMAGE_LC}:build-${BUILD_NUMBER}"
          fi

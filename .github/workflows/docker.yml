name: Docker Image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Published build numbers belong to this workflow. Keep it as the sole owner
  # of the sequence; raise the offset if the workflow counter ever loses
  # continuity so a new build remains greater than every existing build tag.
  BUILD_NUMBER_OFFSET: 0
  GOPROXY: https://proxy.golang.org,direct
  GOPRIVATE: github.com/Silo-Server/*
  GONOSUMDB: github.com/Silo-Server/*

jobs:
  prepare:
    name: Prepare build identity
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      build_number: ${{ steps.identity.outputs.build_number }}
      built_at: ${{ steps.identity.outputs.built_at }}
      image_version: ${{ steps.identity.outputs.image_version }}
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Resolve build identity
        id: identity
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TARGET_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          if [[ -z "$DEFAULT_BRANCH" ]]; then
            echo "::error::Repository default branch is unavailable."
            exit 1
          fi

          build_number=""
          image_version="${GITHUB_SHA::7}"
          if [[ "$TARGET_BRANCH" == "$DEFAULT_BRANCH" ]]; then
            build_number=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))
            if (( build_number <= 0 )); then
              echo "::error::Build number must be positive."
              exit 1
            fi
            image_version="build-${build_number}"
          fi

          {
            echo "build_number=${build_number}"
            echo "built_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "image_version=${image_version}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    permissions:
      contents: read
      actions: read
      packages: write
    uses: Silo-Server/silo-server/.github/workflows/trusted-linux-build.yml@main
    with:
      platform: ${{ matrix.platform }}
      build_number: ${{ needs.prepare.outputs.build_number }}
      built_at: ${{ needs.prepare.outputs.built_at }}
      image_version: ${{ needs.prepare.outputs.image_version }}

  merge:
    runs-on: ubuntu-24.04
    needs: [prepare, build]
    if: "!cancelled() && needs.prepare.result == 'success' && needs.build.result == 'success'"
    permissions:
      packages: write

    steps:
      - name: Prepare lowercase image name
        run: echo "IMAGE_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The base image is the omnibus build's starting point, not a published
      # image: its only tag is the commit SHA with -base added. dev, latest,
      # build-N, and the bare SHA belong to the omnibus image.
      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          BASE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}-base
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create -t "${REGISTRY}/${IMAGE_LC}:${BASE_TAG}" \
            $(printf "${REGISTRY}/${IMAGE_LC}@sha256:%s " *)
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE_LC}:${BASE_TAG}"

  # The published image: PostgreSQL, Redis, Meilisearch, and s6-overlay
  # layered on the base image the merge job just pushed. It carries dev,
  # build-N, the commit SHA, and latest until the first release
  # (release-published.yml adds version tags and moves latest after that).
  # Its digest artifacts are named so the merge job's digests-* pattern never
  # picks them up.
  omnibus:
    needs: [prepare, merge]
    if: "!cancelled() && needs.merge.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    permissions:
      contents: read
      packages: write
    uses: Silo-Server/silo-server/.github/workflows/omnibus-build.yml@main
    with:
      platform: ${{ matrix.platform }}
      base_tag: ${{ github.event.workflow_run.head_sha || github.sha }}-base
      build_number: ${{ needs.prepare.outputs.build_number }}
      built_at: ${{ needs.prepare.outputs.built_at }}
      image_version: ${{ needs.prepare.outputs.image_version }}

  omnibus-merge:
    runs-on: ubuntu-24.04
    needs: [prepare, omnibus]
    if: "!cancelled() && needs.prepare.result == 'success' && needs.omnibus.result == 'success'"
    permissions:
      packages: write

    steps:
      - name: Prepare lowercase image name
        run: echo "IMAGE_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: omnibus-digests-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_LC }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=dev
            type=raw,value=build-${{ needs.prepare.outputs.build_number }}
            type=raw,value=${{ (github.event.workflow_run.head_sha || github.sha) }}

      # latest follows main builds only until the first release; after that,
      # release-published.yml moves it. Decide right before pushing, not when
      # the build started, so a build that began before the first release
      # can't overwrite the release's latest.
      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags="$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          if [[ -z "$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" 'refs/tags/v[0-9]*')" ]]; then
            tags+=" -t ${REGISTRY}/${IMAGE_LC}:latest"
          fi
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $tags \
            $(printf "${REGISTRY}/${IMAGE_LC}@sha256:%s " *)

      - name: Inspect manifest list
        env:
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE_LC}:${{ github.event.workflow_run.head_sha || github.sha }}"
          if [[ "${GITHUB_REF_NAME}" == "${DEFAULT_BRANCH}" || "${{ github.event.workflow_run.head_branch }}" == "${DEFAULT_BRANCH}" ]]; then
            docker buildx imagetools inspect "${REGISTRY}/${IMAGE_LC}:build-${BUILD_NUMBER}"
          fi

name: v1 capability proposal
description: Propose a user-facing capability for the Silo v1 scope lock
title: "[v1] <capability name>"
labels: ["v1-proposed"]
body:
  - type: markdown
    attributes:
      value: |
        One proposal per **user-facing capability** (e.g. "Manga library type", "Transcoded playback"),
        not per PR or per endpoint. Locked capabilities are what the client teams plan against —
        the **API surface** section is mandatory for a capability to be lockable.
        Capability scope state and lock rules: `docs/architecture/v1-scope.md`.
        New API surface targets `/api/v2`, Silo 1.0's stable native contract; `/api/v1` is frozen
        and takes no new capability work. Contract rules: `docs/architecture/api-contract.md`.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One paragraph, user-facing language. What can a user do when this ships?
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: User value / why v1
      description: Why does v1 need this rather than v1.1?
    validations:
      required: true
  - type: textarea
    id: api-surface
    attributes:
      label: API surface
      description: >
        Operations clients will call (method + path + operation ID + notable request/response
        fields), under `/api/v2`. Point at `contracts/api/v2/openapi.json` where the operation
        already exists. A capability cannot be Locked without this section filled in.
      placeholder: |
        GET  /api/v2/manga/{series_id}/chapters (listMangaChapters) — chapters (id, index, volume, read_state)
        POST /api/v2/sync/progress (syncProgress) — records reading progress (existing operation, new item type)
    validations:
      required: true
  - type: textarea
    id: client-impact
    attributes:
      label: Client impact (android / apple / web)
      description: What must each client build to surface this capability? "None" is a valid answer per client.
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Rough size (server-side)
      options:
        - S
        - M
        - L
    validations:
      required: true
  - type: input
    id: ai-harness
    attributes:
      label: AI harness
      description: Enter the exact agent harness or application, or "none".
    validations:
      required: true
  - type: input
    id: ai-tools
    attributes:
      label: AI tool(s)
      description: Enter the exact tool name(s), or "none".
    validations:
      required: true
  - type: input
    id: ai-models
    attributes:
      label: AI model(s)
      description: Enter the exact model identifier(s) reported by each tool, or "n/a".
    validations:
      required: true
  - type: dropdown
    id: ai-involvement
    attributes:
      label: AI involvement
      options:
        - No AI used
        - Human-written, AI-reviewed
        - AI-assisted
        - Fully AI-generated, human verified
    validations:
      required: true
  - type: textarea
    id: ai-review
    attributes:
      label: Independent or adversarial review
      description: Summarize the scope, method, findings, and resolutions, or enter "n/a" when this issue does not require independent or adversarial review.
    validations:
      required: true

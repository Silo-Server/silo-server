version: "2"

run:
  # Diff-scoped CI runs over large PRs exceed 5m on the shared runner (exit 4).
  timeout: 15m
  # Wait for another run on this machine to finish instead of failing after
  # 5s with "parallel golangci-lint is running". A cold run saturates every
  # core, so queueing concurrent runs (several agents, several worktrees)
  # beats running them side by side. Never pass --allow-parallel-runners.
  allow-serial-runners: true
  modules-download-mode: readonly

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    # Format files as touched.
    goimports:
      local-prefixes:
        - github.com/Silo-Server/silo-server

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - goconst
    - govet
    - ineffassign
    - misspell
    - nilerr
    - sloglint
    - staticcheck
    - unconvert
    - unused
    - wastedassign
    - noctx
    - nilnesserr
    - durationcheck
    - makezero
    - asasalint
    - gocheckcompilerdirectives
    - nosprintfhostport
    - usetesting
    - rowserrcheck
    - sqlclosecheck
    - errchkjson
    - exhaustive
    - revive
    - fatcontext
    - forcetypeassert
    - containedctx
    - gosec
    - bidichk
    - nolintlint
    - perfsprint
    - predeclared
    - iface
    - interfacebloat
    - errname
    - recvcheck
    - forbidigo
    - gocritic
    - funlen
    - gocyclo
    - nestif
    - asciicheck
    - exptostd
    - gochecksumtype
    - gomoddirectives
    - iotamixing
    - zerologlint
    - reassign
    - goprintffuncname
    - mirror

  # Unenrolled checks retain their selection reason. Failed scans are unmeasured.
  # - prealloc # 222 findings; disabled pending review.
  # - gocognit # Declined: funlen, gocyclo, and nestif own function limits.
  # - mnd # Declined: broad style cleanup.
  # - dupl # Declined: broad style cleanup.
  # - wrapcheck # Declined: broad style cleanup.
  # - contextcheck # not measured; needs a prototype for detached Background cancellation.
  # - canonicalheader # 41 findings; disabled pending review.
  # - nilnil # 879 findings; TEST nil/value contracts require review.
  # - thelper # 195 findings; disabled pending review.
  # - unparam # 227 findings; TEST public parameters require consumer review.
  # - usestdlibvars # 244 findings; disabled pending review.
  # - dupword # 43 findings; disabled pending review.
  # - nakedret # 12 findings; disabled pending review.
  # - intrange # 278 findings; disabled pending review.
  # - modernize # 1405 findings; disabled pending review.
  # - varnamelen # 7302 findings; disabled pending review.
  # - tagliatelle # 1046 findings; disabled pending review.
  # - copyloopvar # 83 findings; disabled pending review.
  # - musttag # 108 findings; disabled pending review.
  # - dogsled # 40 findings; disabled pending review.
  # - embeddedstructfieldcheck # 765 findings; TEST mutex/embedding contracts require review.
  # - whitespace # 57 findings; disabled pending review.
  # - spancheck # Declined for six tracing sites.
  # - err113 # Declined: error-style cleanup.
  # - lll # Declined: line wrapping.
  # - fieldalignment # Declined: struct reordering.

  settings:
    funlen:
      lines: 100
      statements: -1
    gocyclo:
      min-complexity: 30
    nestif:
      min-complexity: 4

    gocritic:
      disable-all: true
      enabled-checks:
        - argOrder
        # - assignOp # 21 findings; disabled.
        - badCall
        - badCond
        - caseOrder
        - codegenComment
        - defaultCaseOrder
        # - deprecatedComment # 1 findings; disabled.
        - dupArg
        - dupBranchBody
        - dupCase
        - dupSubExpr
        - elseif
        - exitAfterDefer
        - flagDeref
        - flagName
        # - mapKey # 14 findings, all whitespace-trimming test inputs; disabled.
        - newDeref
        - offBy1
        - regexpMust
        - sloppyLen
        - sloppyTypeAssert
        - switchTrue
        - typeSwitchVar
        - underef
        # - unlambda # 4 findings; disabled.
        - unslice
        - valSwap
        - wrapperFunc
        - badLock
        - badRegexp
        - badSyncOnceFunc
        - deferInLoop
        - externalErrorReassign
        - sortSlice
        - truncateCmp
        - uncheckedInlineErr
        # - weakCond # 10 findings, all regexp index results, which are full length when non-nil; disabled.
        - badSorting
        - dynamicFmtString
        - evalOrder
        - returnAfterHttpError
        - sqlQuery
        # - emptyFallthrough # 1 findings; disabled.
        # - rangeValCopy # 1200 findings; disabled.
        # - hugeParam # Declined: broad performance cleanup.
        - rangeExprCopy
        # - appendCombine # 17 findings; disabled.
        - indexAlloc
        # - preferStringWriter # 1 findings; disabled.
        - preferFprint
        - preferWriteByte
        - sliceClear
        # - stringXbytes # 28 findings; disabled.
        # - boolExprSimplify # 1 findings; disabled.
        # - builtinShadow # 123 findings; disabled.
        - dupImport
        # - emptyStringTest # 15 findings; disabled.
        # - equalFold # 12 findings; disabled.
        # - filepathJoin # 15 findings; disabled.
        # - httpNoBody # 1114 findings; disabled.
        # - importShadow # 97 findings; disabled.
        # - nestingReduce # 19 findings; disabled.
        - nilValReturn
        - redundantSprint
        - regexpPattern
        # - sloppyReassign # 120 findings; disabled.
        # - sprintfQuotedString # 16 findings; disabled.
        # - stringConcatSimplify # 5 findings; disabled.
        - timeExprSimplify
        - unnecessaryBlock
        - unnecessaryDefer

    # gocritic.settings.hugeParam: declined broad performance cleanup.
    # gocritic:
    #   settings:
    #     hugeParam:
    #       sizeThreshold: 256
    # nilnil: 879 findings; TEST remains inactive.
    # nilnil:
    #   detect-opposite: true
    # nakedret: 12 findings; inactive.
    # nakedret:
    #   max-func-lines: 10

    gomoddirectives:
      # Allow local replace directives.
      replace-local: true

    # tagliatelle: 1046 findings; inactive.
    # tagliatelle:
    #   case:
    #     rules:
    #       json: snake
    #       yaml: kebab
    # varnamelen: 7302 findings; inactive.
    # varnamelen:
    #   min-name-length: 3
    #   max-distance: 10
    #   check-receiver: false
    #   check-return: false
    #   check-type-param: false
    #   ignore-type-assert-ok: true
    #   ignore-map-index-ok: true
    #   ignore-chan-recv-ok: true
    #   ignore-names: [err, fd, db, tx, mu, rl, wg]
    #   ignore-decls:
    #     - t testing.T
    #     - b testing.B
    #     - i int
    #     - T any
    #     - wg sync.WaitGroup
    #     - w http.ResponseWriter
    #     - r *http.Request
    # copyloopvar: 83 findings; inactive.
    # copyloopvar:
    #   check-alias: true
    # embeddedstructfieldcheck: 765 findings; TEST remains inactive.
    # embeddedstructfieldcheck:
    #   forbid-mutex: true

    govet:
      enable:
        - nilness
        - unusedwrite
        - reflectvaluecompare
        - sortslice
        - deepequalerrors
      # enable-all: true # Unmeasured; retain the repository analyzer set.
      # disable: [fieldalignment] # Declined: struct reordering work.

    rowserrcheck:
      packages:
        - github.com/jackc/pgx/v5

    errchkjson:
      check-error-free-encoding: true

    exhaustive:
      explicit-exhaustive-switch: true
      explicit-exhaustive-map: true
      default-signifies-exhaustive: false
      # default-signifies-exhaustive: true # A default does not prove enum coverage.
      # explicit-exhaustive-switch: false # Default-on exhaustiveness declined.

    revive:
      enable-default-rules: false
      rules:
        - name: unconditional-recursion
        - name: datarace
        - name: waitgroup-by-value
        - name: range-val-address
        - name: defer
        - name: time-equal
        - name: atomic
        - name: identical-branches
        - name: identical-ifelseif-branches
        # - name: identical-switch-branches # 56 findings; disabled.
        - name: identical-switch-conditions
        # - name: var-naming # Declined naming work.
        # - name: exported # Declined naming/documentation work.
        # - name: package-comments # Declined naming/documentation work.
        # - name: receiver-naming # Declined naming work.
        # - name: confusing-naming # Declined naming work.
        # - name: time-naming # Declined naming work.
      # enable-all-rules: true # Select only measured zero-finding unnamed rules.

    fatcontext:
      check-struct-pointers: true

    gosec:
      excludes:
        - G104 # errcheck owns unchecked errors.
      # G201/G202 value-versus-identifier ruleguard: not measured; needs a prototype.
      # severity: medium # Retain default security coverage.
      # confidence: medium # Retain default security coverage.

    nolintlint:
      require-explanation: true
      require-specific: true

    forbidigo:
      forbid:
        - pattern: '^time\.Sleep$'
          msg: Wait on observable state; timing tests require a reasoned nolint.
      analyze-types: true
      exclude-godoc-examples: false

    perfsprint:
      int-conversion: true
      err-error: true
      errorf: true
      sprintf1: true

    iface:
      enable: [identical, unused, opaque]

    interfacebloat:
      max: 20
      # max: 10 # The agreed interface limit is 20.

    recvcheck:
      disable-builtin: false

    sloglint:
      # Require the context-carrying slog variants (InfoContext, …) wherever a
      # context.Context is in scope, so log records correlate with the active
      # OpenTelemetry trace. "scope" (not "all") allows the plain Info/… form in
      # background/init code where no ctx exists. Enforced repo-wide after the
      # phase-3 sweep converted the ~1,159 legacy call sites.
      context: "scope"
      # Message must be a constant, not a built string; move dynamic parts to attrs.
      static-msg: true
      # Attribute keys are snake_case (component, request_id, trace_id, …).
      key-naming-case: snake
      # Don't mix key-value pairs and slog.Attr in one call.
      no-mixed-args: true

    errcheck:
      check-type-assertions: true

    errorlint:
      errorf: true
      asserts: true
      comparison: true

    goconst:
      min-len: 3
      min-occurrences: 3

    misspell:
      locale: US

  exclusions:
    # Anchored regexes, not directory names: `paths` matches anywhere in the
    # path, so a bare `web` also excluded internal/jellycompat/web_component.go,
    # internal/webhooksync/, internal/notifications/webhook*.go and every other
    # non-test file with "web" in its name — 14 files that were being linted
    # before.
    paths:
      - ^web/
      - ^migrations/

    rules:
      - path: _test\.go$
        linters:
          - noctx
          - gosec
          - forcetypeassert
          - errchkjson
      # Sleeps in production are not test synchronization.
      - path-except: _test\.go$
        linters:
          - forbidigo
      # Allow repeated strings in test files
      - path: _test\.go
        linters:
          - goconst

      # Allow unchecked errors in test cleanup/defer
      - path: _test\.go
        text: "Error return value is not checked"
        linters:
          - errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false


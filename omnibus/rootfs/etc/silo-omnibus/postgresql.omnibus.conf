# Written by the Silo omnibus image on every start. Do not edit this file;
# put overrides in another file in this directory (for example 10-local.conf).
# Files load in name order, and postgresql.auto.conf, which Silo's
# POSTGRES_TUNE manages, loads after all of them.

# Local connections only; ENABLE_NODE_ACCESS adds 01-node-access.conf to listen
# on the network. Silo connects over the socket as the silo user.
listen_addresses = ''
unix_socket_directories = '/run/postgresql'

# System V shared memory is not capped by the container's /dev/shm size
# (64 MB by default under Docker), which POSIX shared memory would be.
dynamic_shared_memory_type = sysv

# Per-query call counts and time for diagnosing slow queries; a Silo migration
# creates the extension. Changing this list takes a restart.
shared_preload_libraries = 'pg_stat_statements'

log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] postgres: '

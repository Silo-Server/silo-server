services:
  silo:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${NVIDIA_GPU_COUNT:-1}
              # "video" mounts the NVENC/NVDEC driver libraries. Listing only
              # "gpu" leaves the toolkit default (compute,utility), so FFmpeg
              # sees the GPU but falls back to software encoding.
              capabilities: [gpu, compute, utility, video]

  # Optional distributed-mode example. Most single-host installs should

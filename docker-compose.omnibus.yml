# Single-container deployment with the omnibus image: Silo and PostgreSQL in
# one container, with Redis and Meilisearch available on request. See
# docs/omnibus-image.md. Use this file on its own, not layered on
# docker-compose.yml:
#
#   docker compose -f docker-compose.omnibus.yml up -d
services:
  silo:
    image: ${SILO_OMNIBUS_IMAGE:-ghcr.io/silo-server/silo-server:latest-omnibus}
    restart: unless-stopped
    # Silo drains in-flight requests on stop and PostgreSQL shuts down after
    # it. Docker's default 10s would cut that short.
    stop_grace_period: 2m
    environment:
      # The account that runs Silo and owns /config/silo and the media reads.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      # Master key for at-rest credential encryption. Generate with:
      # openssl rand -base64 48. Back it up separately from the database.
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env — generate one with openssl rand -base64 48}
      # Both are off by default. Set to "true" to start the bundled service.
      ENABLE_REDIS: ${ENABLE_REDIS:-false}
      ENABLE_MEILISEARCH: ${ENABLE_MEILISEARCH:-false}
    ports:
      - "${PORT:-8090}:8080"
      - "${JF_PORT:-8096}:8096"
      - "${ABS_PORT:-13378}:13378"
    volumes:
      - ${SILO_CONFIG_ROOT:-/opt/silo/config}:/config
      - ${MEDIA_ROOT:?Set MEDIA_ROOT in .env to the host media path}:${MEDIA_CONTAINER_ROOT:-/mnt/media}:ro
      # Transcode segments and prepared downloads. Optional; without these
      # mounts they live in the container's /tmp and vanish on recreation.
      - ${SILO_CONFIG_ROOT:-/opt/silo/config}/transcode:/tmp/silo-transcode
      - ${SILO_CONFIG_ROOT:-/opt/silo/config}/download-artifacts:/tmp/silo-download-artifacts
      # Only load-bearing when the Docker host is itself an LXC container; see
      # the note in docker-compose.yml. Harmless elsewhere.
      - /proc/meminfo:/host/proc/meminfo:ro
      - /proc/stat:/host/proc/stat:ro
      - /proc/loadavg:/host/proc/loadavg:ro
    env_file:
      - path: .env
        required: false
